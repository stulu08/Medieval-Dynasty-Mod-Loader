; DevTools - MDML developer tools (SDK generator). DISABLED BY DEFAULT.
; The loader only loads a mod folder whose mod.ini has a [Mod] section. To enable DevTools, remove the ';' in front of
; the next two lines and restart the game. Open the MDML UI (F1); the "DevTools" window opens with it.
;[Mod]
;DLLPath=DevTools.dll

; Export lists: any "*.export" file next to a mod's mod.ini (Content/Mods/<Mod>/) lists the SDK packages that mod
; needs, one per line (see Example.export in this folder and docs/SDK_GENERATOR.md).
