;A mod is a folder in Content/Mods with this mod.ini. It has up to three components, each declared by its own section:
;[Core] (native DLL), [Blueprint] (cooked assets + optional actor), [Overwrite] (loose files that replace game files).
[Mod]
Name=Your Mod
Version=1.0.0
Author=You
Description=Template for a core mod

[Core]
;The file name of your dll as a relative path from your mod folder (default: <folder name>.dll)
Dll=PresetMod.dll
;None | Console | File: the logger CoreMod::logger
Logger=File
;1 = the Mod Loader window shows a button for the mod, if pressed OnModMenuButtonPressed will be called
MenuButton=1

;[Blueprint]
;The file name of your actor as a relative path from your mod folder, leave it out for an asset-only mod
;Actor=Content/ModActor.uasset
;Game (default) | Menu | Always | Never (read by the loader, applied with the Blueprint rework)
;SpawnIn=Game
;The file name of your persistent object (not needed)
;Persistent=Content/ModInstanceObject.uasset
;Events forwarded to the actor (applied with the Blueprint rework)
;Events=Tick,PostBeginPlay

;[Overwrite]
;The folder where your stuff is located, mdml will recursivly iterate over it and create links for every file and delete if after closing
;Folder=OverwriteContent
