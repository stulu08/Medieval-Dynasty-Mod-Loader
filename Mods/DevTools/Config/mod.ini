; DevTools - MDML developer tools (SDK generator, object browser, INI browser/editor, player tools,
; dev-build flag swap). DISABLED BY DEFAULT.
; A mod folder is only loaded if its mod.ini has a [Core], [Blueprint] or [Overwrite] section. To enable DevTools, remove
; the ';' in front of "[Core]", "Dll" and "MenuButton" and restart the game (Config/LoadOrder.ini must not say DevTools = 0).
; Open the MDML UI (F1); the "DevTools" window opens with it.
[Mod]
Name=DevTools
Version=0.1.0
Author=Stulu
Description=MDML developer tools: SDK generator (Dumper-7 analysis + MDML backend), object browser, INI editor, player tools

;[Core]
;Dll=DevTools.dll
;Logger=File
;MenuButton=1

; Export lists: any "*.export" file next to a mod's mod.ini (Content/Mods/<Mod>/) lists the SDK packages that mod
; needs, one per line (see Example.export in this folder and docs/SDK_GENERATOR.md).

; Comments are whole lines starting with ';' (a ';' after a value belongs to the value).
[Config]
; 1 = swap the game's IsDevelopmentBuild/IsShippingBuild functions so the game believes it is a development build
; (BaseMod did this always). 0 = leave the game alone (default).
DevBuildFlags=0
; Folder for "Generate SDK" output: absolute, or relative to the MDML.dll folder (Binaries/Win64). Empty = SDK-Out next
; to MDML.dll. Example: SDKOutputDir=C:/dev/MDML/dumps
SDKOutputDir=
; 1 = show "Cheat menu" -> "Open cheat menu" in the player tools; it calls the game's PC_Player_C::CheatMenu()
; (experimental: in game 2.7.0.4 the call goes through but no menu appears).
EnableCheatsMenu=0

; Cheat menu asset override (moved here from BaseMod, owner decision 2026-10-14). Works independently of [Core]
; above. Off by default (section commented out): the asset was cooked for game 2.2.0.8 and is unverified for 2.7.0.4.
; Link every file of the folder into the game's Content folder by removing the ';' in front of the next two lines.
;[Overwrite]
;Folder=OverrideContent
