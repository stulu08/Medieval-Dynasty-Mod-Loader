; DevTools - MDML developer tools (SDK generator, object browser, legacy exporter, INI browser/editor, player tools,
; dev-build flag swap). DISABLED BY DEFAULT.
; The loader only loads a mod folder whose mod.ini has a [Mod] section. To enable DevTools, remove the ';' in front of
; the next two lines and restart the game (Config/LoadOrder.ini must not say DevTools = 0). Open the MDML UI (F1); the "DevTools" window opens with it.
;[Mod]
;DLLPath=DevTools.dll

; Export lists: any "*.export" file next to a mod's mod.ini (Content/Mods/<Mod>/) lists the SDK packages that mod
; needs, one per line (see Example.export in this folder and docs/SDK_GENERATOR.md).

; Comments are whole lines starting with ';' (a ';' after a value belongs to the value).
[Config]
; 1 = swap the game's IsDevelopmentBuild/IsShippingBuild functions so the game believes it is a development build
; (BaseMod did this always; now it only happens while DevTools is enabled). 0 = leave the game alone.
DevBuildFlags=1
; Not supported with game 2.7.0.4 yet (waiting for the new SDK): only logs a warning.
EnableCheatsMenu=0
