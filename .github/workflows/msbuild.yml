name: Build

on:
  push:
    branches: [ "main", "modernize" ]
  pull_request:
    branches: [ "main", "modernize" ]

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64
  OUTPUT_DIR: bin/Release-windows-x86_64

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Downloads the pinned premake to Dependencies/premake (scripts/python/setupPremake.py) and generates the VS2022 projects
    # (MDML.sln is generated here and not tracked; MDML.slnx and the vcxproj files are tracked for VS 2026).
    - name: Setup premake and generate Visual Studio 2022 projects
      run: python scripts/python/setup.py --yes vs2022

    # NOTE: the generated SDK static lib (SDK.lib) is ~2.5 GB and takes a long time to build.
    # This may hit runner disk/time limits; the SDK is going to be replaced (MODERNIZATION_PLAN 2.4).
    - name: Build
      run: msbuild MDML.sln /m /nologo /v:minimal /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }}

    # Copy only the runtime files; skip SDK.lib, *.lib, *.pdb, *.exp, *.ilk (huge / not needed).
    - name: Stage artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force stage | Out-Null
        robocopy "${{ env.OUTPUT_DIR }}" stage /E /XF *.lib *.pdb *.exp *.ilk *.iobj *.ipdb /NFL /NDL /NJH /NJS /NP
        # robocopy exit codes 0-7 are success
        if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
        exit 0

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MDML-${{ env.BUILD_CONFIGURATION }}-x64
        path: stage
        if-no-files-found: error
