name: Build

on:
  push:
    branches: [ "main", "modernize" ]
  pull_request:
    branches: [ "main", "modernize" ]

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64
  OUTPUT_DIR: Output

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Downloads the pinned premake to Dependencies/premake (scripts/python/setupPremake.py) and generates the VS2022 projects
    # (MDML.sln and all vcxproj files are generated by premake and not tracked).
    - name: Setup premake and generate Visual Studio 2022 projects
      run: python scripts/python/setup.py --yes vs2022

    # The generated SDK (Loader/SDK/Generated) is header-only since Wave 4 step B: no SDK.lib to build any more.
    - name: Build
      run: msbuild MDML.sln /m /nologo /v:minimal /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }}

    # Copy only the runtime files; skip *.lib, *.pdb, *.exp, *.ilk (not needed).
    - name: Stage artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force stage | Out-Null
        robocopy "${{ env.OUTPUT_DIR }}" stage /E /XF *.lib *.pdb *.exp *.ilk *.iobj *.ipdb /NFL /NDL /NJH /NJS /NP
        # robocopy exit codes 0-7 are success
        if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
        exit 0

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MDML-${{ env.BUILD_CONFIGURATION }}-x64
        path: stage
        if-no-files-found: error
